<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#5b3df5" />
<title>מי זה? · משחק המשפחה</title>
<style>
  :root{
    --bg:#f3f0ff; --card:#ffffff; --ink:#22203a; --muted:#6b6785;
    --brand:#5b3df5; --brand-2:#8f7bff; --ok:#12b76a; --bad:#f04438;
    --shadow:0 10px 30px rgba(40,25,110,.13); --r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Rubik","Assistant","Segoe UI",Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 90% -10%, #e5dcff 0%, transparent 60%),
      radial-gradient(700px 500px at -10% 110%, #ffe6c9 0%, transparent 60%),
      var(--bg);
    color:var(--ink); min-height:100svh;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .wrap{width:100%; max-width:560px}
  .card{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:20px; text-align:center}

  h1{margin:0 0 6px; font-size:clamp(26px,7vw,38px); font-weight:800; letter-spacing:-.5px}
  .sub{margin:0 0 22px; color:var(--muted); font-size:clamp(14px,3.6vw,17px)}

  .btn{
    display:block; width:100%; border:0; cursor:pointer; font-family:inherit;
    font-size:clamp(18px,4.6vw,22px); font-weight:700; color:#fff; padding:18px 16px;
    border-radius:18px; background:linear-gradient(180deg,var(--brand-2),var(--brand));
    box-shadow:0 6px 0 #4527d6; margin-bottom:14px; transition:transform .06s, box-shadow .06s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #4527d6}
  .btn.ghost{background:#fff; color:var(--brand); box-shadow:0 0 0 2px #e3dcff inset}
  .btn.ghost:active{transform:translateY(2px)}
  .btn.small{font-size:16px; padding:13px}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
  .pill{background:#efeaff; color:var(--brand); font-weight:700; border-radius:999px; padding:7px 14px; font-size:15px}
  .pill.score{background:#fff4e0; color:#a15c00}
  .iconbtn{background:#efeaff;border:0;color:var(--brand);font-size:20px;width:40px;height:40px;border-radius:999px;cursor:pointer;font-family:inherit}

  .bar{height:10px; background:#e9e4ff; border-radius:999px; overflow:hidden; margin-bottom:16px}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--brand-2),var(--brand)); width:0%; transition:width .35s}

  .photo{
    width:100%; aspect-ratio:1/1; max-height:42svh; object-fit:cover;
    border-radius:20px; background:#eee; display:block; margin:0 auto 16px;
    box-shadow:0 8px 22px rgba(40,25,110,.16);
  }
  .q{font-size:clamp(20px,5vw,26px); font-weight:800; margin:0 0 16px}

  .opts{display:grid; gap:12px}
  .opt{
    border:0; font-family:inherit; cursor:pointer; background:#fff; color:var(--ink);
    font-size:clamp(19px,4.8vw,23px); font-weight:700; padding:17px 14px; border-radius:16px;
    box-shadow:0 0 0 2px #e6e1ff inset, 0 3px 0 #e6e1ff; transition:transform .06s;
  }
  .opt:active{transform:translateY(2px)}
  .opt.correct{background:#e7f8ef; color:#03774a; box-shadow:0 0 0 3px var(--ok) inset}
  .opt.wrong{background:#feecea; color:#912018; box-shadow:0 0 0 3px var(--bad) inset}
  .opt[disabled]{cursor:default}

  /* answer card shown after every question */
  .answer{margin-top:16px; padding:14px; border-radius:16px; background:#f6f3ff; display:none}
  .answer.show{display:block}
  .answer .ttl{
    font-size:clamp(15px,3.8vw,18px); font-weight:700; color:#a15c00; background:#fff4e0;
    display:inline-block; padding:4px 12px; border-radius:999px; margin-bottom:8px;
  }
  .answer .nm{font-size:clamp(24px,6.2vw,32px); font-weight:800; color:var(--brand); line-height:1.25}
  .answer .alias{font-size:clamp(15px,3.8vw,17px); color:var(--muted); margin-top:4px}
  .answer .pron{
    font-size:clamp(17px,4.2vw,20px); font-weight:700; color:#0d7a55; margin-top:8px;
    direction:ltr; letter-spacing:.4px;
  }
  .feedback{min-height:30px; margin-top:12px; font-size:clamp(18px,4.4vw,22px); font-weight:800}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}

  .mic{
    width:104px;height:104px;border-radius:999px;border:0;cursor:pointer;font-size:42px;color:#fff;
    background:linear-gradient(180deg,var(--brand-2),var(--brand)); box-shadow:0 8px 0 #4527d6; margin:4px auto 16px; display:block;
  }
  .mic:active{transform:translateY(4px); box-shadow:0 4px 0 #4527d6}
  .mic.live{animation:pulse 1.1s infinite; background:linear-gradient(180deg,#ff8a8a,#f04438); box-shadow:0 8px 0 #b42318}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .heard{color:var(--muted); font-size:16px; min-height:24px; margin-bottom:10px}

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .big{font-size:clamp(46px,13vw,68px); margin:6px 0}
  .star{font-size:34px; letter-spacing:4px; margin-bottom:6px}
  .warn{background:#fff7e6;border:1px solid #ffd591;color:#8a5a00;border-radius:14px;padding:12px;font-size:14px;margin-bottom:16px;text-align:right;line-height:1.5}
  .hint{color:var(--muted); font-size:15px; margin:0}
  .hidden{display:none !important}
  @media (min-width:700px){ .card{padding:30px} }
</style>
</head>
<body>
<div class="wrap">

  <section id="home" class="card">
    <h1>מי זה? 🎉</h1>
    <p class="sub">משחק היכרות עם המשפחה</p>
    <div id="setupWarn" class="warn hidden"></div>
    <button class="btn" data-mode="choose">👆 בחרו מתוך 3</button>
    <button class="btn" data-mode="say">🗣️ אמרו את השם</button>
    <p id="loadInfo" class="hint">טוען…</p>
  </section>

  <section id="game" class="card hidden">
    <div class="topbar">
      <button class="iconbtn" id="quit" aria-label="חזרה">✕</button>
      <span class="pill" id="progress">1 / 10</span>
      <span class="pill score" id="score">⭐ 0</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>

    <img id="photo" class="photo" alt="תמונה של בן משפחה" />

    <div id="chooseBox">
      <p class="q" id="qChoose">מי זה?</p>
      <div class="opts" id="opts"></div>
    </div>

    <div id="sayBox" class="hidden">
      <p class="q" id="qSay">אתם יודעים מי זה?</p>
      <button id="mic" class="mic hidden" aria-label="דברו">🎤</button>
      <p id="heard" class="heard"></p>
      <button id="revealBtn" class="btn ghost">👀 גלו את התשובה</button>
      <div id="selfCheck" class="row2 hidden">
        <button class="btn" id="gotIt" style="margin:0">✅ ידעתי</button>
        <button class="btn ghost" id="missedIt" style="margin:0">🙈 לא ידעתי</button>
      </div>
    </div>

    <div id="answer" class="answer">
      <div class="ttl" id="ansTitle"></div>
      <div class="nm" id="ansName"></div>
      <div class="alias" id="ansAlias"></div>
      <div class="pron" id="ansPron"></div>
    </div>

    <p id="feedback" class="feedback"></p>
    <button id="next" class="btn hidden">הבא ➜</button>
  </section>

  <section id="end" class="card hidden">
    <div class="star" id="stars">⭐⭐⭐</div>
    <h1 id="endTitle">כל הכבוד!</h1>
    <p class="big" id="endScore">0 / 10</p>
    <p class="sub" id="endMsg"></p>
    <button class="btn" id="again">🔁 שחקו שוב</button>
    <button class="btn ghost small" id="home2">🏠 למסך הבית</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  var IMG_DIR     = "public/family/";
  var PEOPLE_URL  = IMG_DIR + "people.csv";
  var PHOTOS_URL  = IMG_DIR + "photos.csv";
  var ROUND_SIZE  = 10;

  var byId = {}, people = [], photos = [];
  var deck = [], idx = 0, score = 0, mode = "choose", answered = false, current = null;

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- CSV ---------- */
  function parseCSV(text){
    text = text.replace(/^﻿/, "");
    var rows = [], row = [], cell = "", q = false, i, c;
    for(i = 0; i < text.length; i++){
      c = text[i];
      if(q){
        if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if(c === '"'){ q = true; }
      else if(c === ','){ row.push(cell); cell = ""; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ""; }
      else if(c !== '\r'){ cell += c; }
    }
    if(cell.length || row.length){ row.push(cell); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(v){ return v.trim() !== ""; }); });
  }
  function headerRows(txt, firstCol){
    var rows = parseCSV(txt);
    if(rows.length && new RegExp(firstCol, "i").test((rows[0][0] || "").trim())) rows.shift();
    return rows;
  }
  var cut = function(s){ return (s || "").trim(); };

  function loadData(){
    return Promise.all([
      fetch(PEOPLE_URL, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("people"); return r.text(); }),
      fetch(PHOTOS_URL, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("photos"); return r.text(); })
    ]).then(function(res){
      // people.csv : id, formal, title, nicknames(;), pronunciation, gender
      headerRows(res[0], "id").forEach(function(r){
        var id = cut(r[0]);
        if(!id) return;
        var p = {
          id: id,
          formal: cut(r[1]),
          // a person can hold more than one title (אמא to her own kids, דודה to the rest)
          titles: cut(r[2]).split(";").map(cut).filter(Boolean),
          aliases: cut(r[3]).split(";").map(cut).filter(Boolean),
          pron: cut(r[4]),
          female: /^(f|female|נ|נקבה)$/i.test(cut(r[5]))
        };
        if(!p.formal) return;
        // everything that counts as a correct spoken answer
        p.allNames = [p.formal].concat(p.aliases);
        p.titles.forEach(function(t){
          p.allNames.push(t);                  // "דודה"
          p.allNames.push(t + " " + p.formal); // "דודה יעל"
        });
        byId[id] = p;
        people.push(p);
      });
      // photos.csv : file, person id
      headerRows(res[1], "file").forEach(function(r){
        var f = cut(r[0]), pid = cut(r[1]);
        if(f && byId[pid]) photos.push({ img: IMG_DIR + f, person: byId[pid] });
      });
    });
  }

  /* ---------- helpers ---------- */
  function shuffle(a){
    a = a.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function norm(s){
    return (s || "").replace(/[֑-ׇ]/g, "")
                    .replace(/[^א-תa-zA-Z0-9]/g, "")
                    .toLowerCase();
  }
  var demo = function(p){ return p.female ? "זאת" : "זה"; };

  /* ---------- sound ---------- */
  var actx = null;
  function beep(freqs, dur){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach(function(f, i){
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = f;
        var t0 = actx.currentTime + i * dur;
        g.gain.setValueAtTime(.0001, t0);
        g.gain.exponentialRampToValueAtTime(.25, t0 + .02);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
        o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
      });
    }catch(e){}
  }
  var sGood = function(){ beep([660, 880, 1180], .12); };
  var sBad  = function(){ beep([300, 200], .16); };
  var sWin  = function(){ beep([660, 880, 1180, 1480], .14); };

  function show(which){
    ["home","game","end"].forEach(function(s){ $(s).classList.toggle("hidden", s !== which); });
    window.scrollTo(0, 0);
  }

  /* ---------- speech ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false;

  function initSpeech(){
    if(!SR) return false;
    try{
      rec = new SR();
      rec.lang = "he-IL"; rec.interimResults = false; rec.maxAlternatives = 5;
      rec.onresult = function(e){
        var said = [], i, j;
        for(i = 0; i < e.results.length; i++)
          for(j = 0; j < e.results[i].length; j++) said.push(e.results[i][j].transcript);
        $("heard").textContent = "שמעתי: " + said[0];
        var hit = said.some(function(t){
          var n = norm(t);
          return current.person.allNames.some(function(name){
            var nn = norm(name);
            return nn && (n === nn || n.indexOf(nn) !== -1 || nn.indexOf(n) !== -1);
          });
        });
        judgeSay(hit);
      };
      rec.onerror = function(){ stopMic(); $("heard").textContent = "לא הצלחתי לשמוע, נסו שוב 🙂"; };
      rec.onend = function(){ stopMic(); };
      return true;
    }catch(e){ return false; }
  }
  var speechOK = initSpeech();

  function stopMic(){ listening = false; $("mic").classList.remove("live"); }
  function toggleMic(){
    if(answered) return;
    if(listening){ try{ rec.stop(); }catch(e){} stopMic(); return; }
    try{
      $("heard").textContent = "מקשיב… דברו עכשיו 🎧";
      rec.start(); listening = true; $("mic").classList.add("live");
    }catch(e){ stopMic(); }
  }

  /* ---------- round ---------- */
  function buildDeck(){
    // prefer one photo per person, then top up if the round is still short
    var pool = shuffle(photos), seen = {}, first = [], rest = [];
    pool.forEach(function(ph){
      if(seen[ph.person.id]) rest.push(ph);
      else { seen[ph.person.id] = 1; first.push(ph); }
    });
    return first.concat(rest).slice(0, Math.min(ROUND_SIZE, photos.length));
  }

  function start(m){
    mode = m; deck = buildDeck(); idx = 0; score = 0;
    show("game"); render();
  }

  function render(){
    answered = false;
    current = deck[idx];
    var p = current.person;

    $("progress").textContent = (idx + 1) + " / " + deck.length;
    $("score").textContent = "⭐ " + score;
    $("barFill").style.width = (idx / deck.length * 100) + "%";
    $("feedback").textContent = ""; $("feedback").className = "feedback";
    $("answer").classList.remove("show");
    $("next").classList.add("hidden");
    $("photo").src = current.img;

    $("qChoose").textContent = "מי " + demo(p) + "?";
    $("qSay").textContent = "אתם יודעים מי " + demo(p) + "?";

    if(mode === "choose"){
      $("chooseBox").classList.remove("hidden");
      $("sayBox").classList.add("hidden");
      buildOptions();
    } else {
      $("chooseBox").classList.add("hidden");
      $("sayBox").classList.remove("hidden");
      $("heard").textContent = "";
      $("revealBtn").classList.remove("hidden");
      $("selfCheck").classList.add("hidden");
      $("mic").classList.toggle("hidden", !speechOK);
      stopMic();
    }

    if(deck[idx+1]){ var pre = new Image(); pre.src = deck[idx+1].img; }
  }

  function buildOptions(){
    var me = current.person;
    var pool = people.filter(function(p){
      return p.id !== me.id && norm(p.formal) !== norm(me.formal);
    });
    var others = shuffle(pool).slice(0, 2);
    if(others.length < 2){
      var rest = shuffle(people.filter(function(p){
        return p.id !== me.id && others.indexOf(p) === -1;
      }));
      others = others.concat(rest.slice(0, 2 - others.length));
    }
    var choices = shuffle([me].concat(others));

    var box = $("opts");
    box.innerHTML = "";
    choices.forEach(function(p){
      var b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.textContent = p.formal;
      b.onclick = function(){ pick(b, p, choices); };
      box.appendChild(b);
    });
  }

  function pick(btn, p, choices){
    if(answered) return;
    answered = true;
    var right = (p.id === current.person.id);
    Array.prototype.forEach.call($("opts").children, function(el, i){
      el.disabled = true;
      if(choices[i].id === current.person.id) el.classList.add("correct");
    });
    if(!right) btn.classList.add("wrong");
    finish(right);
  }

  function judgeSay(right){
    if(answered) return;
    answered = true;
    stopMic();
    $("revealBtn").classList.add("hidden");
    $("selfCheck").classList.add("hidden");
    finish(right);
  }

  function showAnswerCard(){
    var p = current.person;
    $("ansTitle").textContent = p.titles.join(" · ");
    $("ansTitle").style.display = p.titles.length ? "inline-block" : "none";
    $("ansName").textContent = p.formal;
    $("ansAlias").textContent = p.aliases.length ? p.aliases.join(" · ") : "";
    $("ansPron").textContent = p.pron || "";
    $("answer").classList.add("show");
  }

  function finish(right){
    var p = current.person;
    if(right){ score++; sGood(); } else sBad();
    $("score").textContent = "⭐ " + score;

    showAnswerCard();

    var yay  = ["מעולה! 🎉","כל הכבוד! 👏","נכון מאוד! ⭐","יופי! 🌟"];
    var nope = ["כמעט! 💪","לא נורא, ממשיכים! 🙂","בפעם הבאה! 🌈"];
    var f = $("feedback");
    var full = (p.titles.length ? p.titles[0] + " " : "") + p.formal;
    f.textContent = right
      ? yay[Math.floor(Math.random()*yay.length)]
      : nope[Math.floor(Math.random()*nope.length)] + " " + demo(p) + " " + full;
    f.className = "feedback " + (right ? "ok" : "bad");

    $("next").classList.remove("hidden");
    $("next").textContent = (idx + 1 < deck.length) ? "הבא ➜" : "לסיום ➜";
  }

  function next(){
    idx++;
    if(idx >= deck.length) return endGame();
    render();
  }

  function endGame(){
    show("end");
    var total = deck.length, pct = score / total;
    $("endScore").textContent = score + " / " + total;
    $("stars").textContent = pct === 1 ? "⭐⭐⭐" : pct >= .6 ? "⭐⭐" : "⭐";
    $("endTitle").textContent = pct === 1 ? "מושלם! 🏆" : pct >= .6 ? "כל הכבוד! 🎉" : "יופי שניסיתם! 🌈";
    $("endMsg").textContent = pct === 1 ? "הכרתם את כל המשפחה!" :
                              pct >= .6 ? "כמעט הכול נכון, עוד קצת ומגיעים לשלושה כוכבים." :
                                          "עוד סיבוב ותכירו עוד יותר.";
    if(pct >= .6) sWin();
  }

  /* ---------- wiring ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function(b){
    b.addEventListener("click", function(){ start(b.getAttribute("data-mode")); });
  });
  $("next").addEventListener("click", next);
  $("quit").addEventListener("click", function(){ stopMic(); show("home"); });
  $("again").addEventListener("click", function(){ start(mode); });
  $("home2").addEventListener("click", function(){ show("home"); });
  $("mic").addEventListener("click", toggleMic);
  $("revealBtn").addEventListener("click", function(){
    if(answered) return;
    stopMic();
    showAnswerCard();
    $("revealBtn").classList.add("hidden");
    $("selfCheck").classList.remove("hidden");
  });
  $("gotIt").addEventListener("click", function(){ judgeSay(true); });
  $("missedIt").addEventListener("click", function(){ judgeSay(false); });

  /* ---------- boot ---------- */
  function disable(msg){
    $("loadInfo").textContent = msg;
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function(b){
      b.disabled = true; b.style.opacity = .5;
    });
  }

  loadData().then(function(){
    if(people.length < 3) return disable("צריך לפחות 3 אנשים ברשימה כדי לשחק.");
    if(photos.length < 1) return disable("אין תמונות ברשימה עדיין.");

    $("loadInfo").textContent = photos.length + " תמונות · " + people.length + " בני משפחה" +
      (photos.length > ROUND_SIZE ? " · " + ROUND_SIZE + " תמונות בכל סיבוב" : "");

    var broken = people.filter(function(p){ return /^[?\s]+$/.test(p.formal); }).length;
    if(broken){
      var w = $("setupWarn");
      w.classList.remove("hidden");
      w.innerHTML = "⚠️ <b>" + broken + "</b> מהשמות בקובץ <code>people.csv</code> אינם קריאים. " +
                    "שמרו את הקובץ בתור <b>CSV UTF-8</b> והעלו מחדש.";
    }
    if(!speechOK) $("loadInfo").textContent += " · מצב הדיבור כאן יעבוד ללא מיקרופון";

    shuffle(photos).slice(0, 3).forEach(function(ph){ var i = new Image(); i.src = ph.img; });
  }).catch(function(e){
    disable("לא הצלחתי לטעון את הנתונים (people.csv / photos.csv).");
  });

})();
</script>
</body>
</html>
